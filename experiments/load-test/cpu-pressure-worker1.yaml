apiVersion: v1
kind: Pod
metadata:
  name: cpu-pressure-worker1
  namespace: scheduler-lab
  labels:
    experiment: cpu-pressure-test
spec:
  nodeName: k8s-worker1
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: cpu-pressure
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
        - |
          end=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            :
          done
      resources:
        requests:
          cpu: "500m"
          memory: "32Mi"
        limits:
          cpu: "1000m"
          memory: "64Mi"

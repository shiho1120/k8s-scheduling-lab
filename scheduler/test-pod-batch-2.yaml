apiVersion: v1
kind: Pod
metadata:
  name: resource-aware-batch-2
  namespace: scheduler-lab
spec:
  schedulerName: resource-aware-scheduler
  restartPolicy: Never
  containers:
    - name: nginx
      image: nginx:stable
      resources:
        requests:
          cpu: "250m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
